<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Şifre Sıfırla — StudyOS</title>
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <form id="reset-form" class="auth-card">
      <h1>Yeni şifre</h1>
      <p class="muted">E-postadaki bağlantıdan geldiniz.</p>
      <label>Yeni şifre<input id="pw1" type="password" minlength="8" required /></label>
      <label>Tekrar<input id="pw2" type="password" minlength="8" required /></label>
      <button type="submit">Şifreyi güncelle</button>
      <p id="msg" class="error" hidden></p>
      <p id="ok" class="muted" hidden style="color:#86efac"></p>
      <a href="/admin/" class="muted" style="text-align:center">Admin girişi</a>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const form = document.getElementById("reset-form");
    const msg = document.getElementById("msg");
    const ok = document.getElementById("ok");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.hidden = true;
      ok.hidden = true;
      const p1 = document.getElementById("pw1").value;
      const p2 = document.getElementById("pw2").value;
      if (p1 !== p2) {
        msg.textContent = "Şifreler eşleşmiyor";
        msg.hidden = false;
        return;
      }
      if (!token) {
        msg.textContent = "Geçersiz bağlantı (token yok)";
        msg.hidden = false;
        return;
      }
      try {
        const res = await fetch("/api/v1/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: p1 }),
        });
        const body = await res.json();
        if (!res.ok || body.success === false) {
          throw new Error(body?.error?.message || "İşlem başarısız");
        }
        ok.textContent = "Şifre güncellendi. Giriş yapabilirsiniz.";
        ok.hidden = false;
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
</body>
</html>
