name: studyos_web
description: "StudyOS — Kurumsal yönetim paneli (Flutter Web)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Networking ────────────────────────────────────────────
  dio: ^5.7.0

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Secure Storage ────────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.9.0
  firebase_analytics: ^11.3.6

  # ── Monitoring ────────────────────────────────────────────
  sentry_flutter: ^8.12.0

  # ── UI Yardımcıları ───────────────────────────────────────
  fl_chart: ^0.69.0
  intl: ^0.19.0
  gap: ^3.0.1
  data_table_2: ^2.5.14   # Web'de büyük veri tabloları

  # ── Utilities ─────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Kod Üretimi ───────────────────────────────────────────
  build_runner: ^2.4.14
  riverpod_generator: ^2.4.4
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
