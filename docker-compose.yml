# StudyOS — Yerel Geliştirme Docker Servisleri
#
# Kullanım:
#   docker compose up -d postgres minio
#   docker compose down
#   docker compose logs -f postgres
#
# Notlar:
#   - Uygulama kodu Docker'da çalışmaz; yalnızca altyapı servisleri çalışır.
#   - Gerçek değerler için .env dosyasını kopyalayın: cp .env.example .env

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyos}
      POSTGRES_DB: ${POSTGRES_DB:-studyos_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: studyos_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Konsol
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
